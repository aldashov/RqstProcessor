version: '3.8'

services:
  # Слой СУБД
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/000001_init.up.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Слой вашего Go-приложения
  app_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_app_container
    ports:
      - "8081:8081"
    depends_on:
      postgres_db:
        condition: service_healthy # Ждем, пока СУБД полностью поднимет сокет
    environment:
      - DATABASE_URL=postgres://postgres:mysecretpassword@postgres_db:5432/postgres?sslmode=disable

volumes:
  pgdata:
